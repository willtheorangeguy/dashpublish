name: Publish container

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to Google Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push release image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ -z "$PROJECT_ID" ]]; then
            echo "Repository variable GCP_PROJECT_ID must be configured." >&2
            exit 1
          fi
          IMAGE="gcr.io/${PROJECT_ID}/dashpublish"
          docker build --tag "${IMAGE}:${RELEASE_TAG}" --tag "${IMAGE}:latest" .
          docker push "${IMAGE}:${RELEASE_TAG}"
          docker push "${IMAGE}:latest"
